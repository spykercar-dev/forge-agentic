[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent-cli"
version = "0.1.0"
description = "A local-first, model-independent terminal coding agent"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
